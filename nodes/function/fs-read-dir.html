<script type="text/javascript">
    RED.nodes.registerType('fs read dir', {
        // en: node-red left sidebar category
        // zh: node-red左边所属分类
        category: 'sunny nie',
        // en: node background color
        // zh: 节点背景颜色
        color: '#FFCC66',
        defaults: {
            name: { value: "fs read dir" },
            dir: { value: "" },
            dirType: { value: "str" },
            // recursive: { value: "false" },
            // withFileTypes: { value: "false" },
            absolute: { value: true },
            useFilter: { value: false },
            filter: { value: "json" },
            fileType: { value: "file" }
        },
        inputs: 1,
        outputs: 1,
        // Font Awesome Icons(https://fontawesome.com/v4/icons)
        icon: "font-awesome/fa-folder-open-o",
        label: function () {
            return this.name || "fs read dir";
        },
        oneditprepare: function () {
            // console.log(this);
            // use filter checkbox control display
            $("#node-input-useFilter").on("change", (e) => {
                // checked to display
                if (e.target.checked) {
                    $("#row-id-fileType").show();
                    // zh: 选择的值为file时才显示
                    if ($("#node-input-fileType").val() == "file") {
                        $("#row-id-filter").show();
                    } else {
                        $("#row-id-filter").hide();
                    }
                } else {
                    // no checked to hide
                    $("#row-id-fileType").hide();
                    $("#row-id-filter").hide();
                }
            })
            // select file type control display
            $("#node-input-fileType").on("change", (e) => {
                if (e.target.value == "file") {
                    $("#row-id-filter").show();
                }
                else if (e.target.value == "directory") {
                    $("#row-id-filter").hide();
                }
            })
            // 
            $("#node-input-dir").typedInput({
                // type: "str",
                types: ["msg", "flow", "global", "str"],
                typeField: "#node-input-dirType"
            });

            // en: init
            // zh: 初始化
            setTimeout(() => {
                console.log(this);
                if (this.useFilter) {
                    $("#row-id-fileType").show();
                    if (this.fileType == "file") {
                        $("#row-id-filter").show();
                    } else {
                        $("#row-id-filter").hide();
                    }
                } else {
                    $("#row-id-fileType").hide();
                    $("#row-id-filter").hide();
                }
            }, 0);
        }
    });
</script>
