<script type="text/javascript">
    RED.nodes.registerType('fs exists', {
        // en: node-red left sidebar category
        // zh: node-red左边所属分类
        category: 'sunny nie',
        // en: node background color
        // zh: 节点背景颜色
        color: '#FFCC66',
        defaults: {
            name: { value: "fs exists" },
            path: { value: "" },
            pathType: { value: "str" },
            useReplace: { value: false },
            replaceText: { value: "" },
            replaceTextType: { value: "str" }
        },
        inputs: 1,
        outputs: 1,
        // Font Awesome Icons(https://fontawesome.com/v4/icons)
        icon: "font-awesome/fa-check-square-o",
        label: function () {
            return this.name || "fs exists";
        },
        oneditprepare: function () {
            $("#node-input-path").typedInput({
                types: ["msg", "flow", "global", "str"],
                typeField: "#node-input-pathType"
            });
            $("#node-input-replaceText").typedInput({
                types: ["msg", "flow", "global", "str"],
                typeField: "#node-input-replaceTextType"
            });
        }
    });
</script>
